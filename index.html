<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f2390">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Hoop Quest: The Legend of API BADDE</title>
<style>
/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#0b0a17;overflow:hidden;overscroll-behavior:none;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:none}
body{font-family:ui-monospace,Menlo,Consolas,monospace}
#screen{position:relative;background:#000;line-height:0;overflow:hidden}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;-ms-interpolation-mode:nearest-neighbor}

/* ---------- PC: no chrome, just the canvas centered ---------- */
#pcStage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0a17}
body.mobile #pcStage{display:none}

/* ---------- Meme overlay (hamster with a heart) ---------- */
#meme{position:absolute;inset:0;display:none;pointer-events:none;overflow:hidden;line-height:1}
#meme.show{display:block}
#meme .ham{position:absolute;left:50%;top:44%;font-size:calc(var(--px,3px)*58);transform:translate(-50%,-50%);
  animation:hamWob 1.8s ease-in-out infinite;filter:drop-shadow(0 calc(var(--px,3px)*3) 0 rgba(60,0,40,.35))}
#meme .ham .h{position:absolute;left:50%;top:94%;font-size:.36em;transform:translate(-50%,-50%);animation:beat .9s ease-in-out infinite}
#meme img{position:absolute;left:50%;top:44%;max-width:66%;max-height:62%;transform:translate(-50%,-50%);
  border:calc(var(--px,3px)*2) solid #fff;box-shadow:0 calc(var(--px,3px)*3) 0 rgba(60,0,40,.35);animation:hamWob 1.8s ease-in-out infinite}
#meme .fh{position:absolute;bottom:-12%;font-size:calc(var(--px,3px)*11);animation:floatUp linear forwards;will-change:transform}
@keyframes hamWob{0%,100%{transform:translate(-50%,-50%) rotate(-5deg) scale(1)}50%{transform:translate(-50%,-53%) rotate(5deg) scale(1.04)}}
@keyframes beat{0%,100%{transform:translate(-50%,-50%) scale(1)}30%{transform:translate(-50%,-50%) scale(1.25)}60%{transform:translate(-50%,-50%) scale(.95)}}
@keyframes floatUp{0%{transform:translate(0,0) scale(.5);opacity:0}12%{opacity:1}100%{transform:translate(var(--dx,0),calc(var(--px,3px)*-185)) scale(1.15);opacity:0}}

/* ============================================================
   MOBILE: premium handheld shell (translucent indigo)
   ============================================================ */
#shell{display:none}
body.mobile #shell{position:fixed;inset:0;height:100vh;height:100dvh;display:grid;overflow:hidden;
  padding:calc(env(safe-area-inset-top) + 34px) calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 10px);
  background:
    radial-gradient(110% 60% at 15% -5%, rgba(255,255,255,.30), rgba(255,255,255,0) 55%),
    radial-gradient(80% 60% at 105% 105%, rgba(8,0,40,.55), rgba(8,0,40,0) 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 2px, transparent 2px 22px),
    repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 26px),
    linear-gradient(160deg,#7464f0 0%,#5040cc 40%,#3a2ca8 70%,#2a1f86 100%);
  grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(12px,1fr) auto auto minmax(64px,.55fr);
  grid-template-areas:"screen screen" ". ." "dpad ab" "pills pills" ". .";align-items:center;justify-items:center}
/* plastic bevel + inner rim */
body.mobile #shell::before{content:'';position:absolute;inset:5px;border-radius:30px;pointer-events:none;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.38),inset 0 -4px 10px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
/* faint "internal circuit" visible through translucent plastic */
body.mobile #shell::after{content:'';position:absolute;left:18%;right:18%;bottom:7%;height:22%;pointer-events:none;opacity:.10;
  background:
    linear-gradient(90deg,transparent 0 12%,#c8f 12% 13%,transparent 13% 40%,#c8f 40% 41%,transparent 41% 70%,#c8f 70% 71%,transparent 71%),
    linear-gradient(0deg,transparent 0 30%,#c8f 30% 32%,transparent 32% 66%,#c8f 66% 68%,transparent 68%);border-radius:12px}

.bezel{grid-area:screen;position:relative;z-index:2;padding:20px 28px 30px;border-radius:14px 14px 38px 14px;
  background:linear-gradient(180deg,#2a2640,#17142a);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.12),inset 0 -2px 5px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.22),0 10px 22px rgba(10,0,40,.45)}
.bezel .led{position:absolute;left:6px;top:44%;width:7px;height:7px;border-radius:50%;background:#ff3b5c;
  box-shadow:0 0 6px 2px rgba(255,60,90,.75),inset 0 1px 1px rgba(255,255,255,.6)}
.bezel .ledlbl{position:absolute;left:2px;top:calc(44% + 11px);font:700 6px/1 system-ui,sans-serif;color:#8f8ab8;letter-spacing:.4px}
.bezel .wordmark{position:absolute;left:0;right:0;bottom:9px;text-align:center;font:italic 800 11px/1 system-ui,sans-serif;color:#cfc9ff;letter-spacing:1.6px;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.bezel .wordmark b{color:#ff9d2e}
.bezel .stripes{position:absolute;right:12px;top:8px;width:46px;height:5px;
  background:linear-gradient(#ff5d7a 0 33%,#ffb547 33% 66%,#6fd1ff 66%);border-radius:2px;opacity:.85}
body.mobile #screen{box-shadow:0 0 0 2px #0a0914}
body.mobile #screen::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(128deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.04) 28%,rgba(255,255,255,0) 29%)}

/* D-pad */
.dpad{grid-area:dpad;position:relative;width:var(--dp,132px);height:var(--dp,132px);z-index:2}
.dpad::before{content:'';position:absolute;inset:-12px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,0,0,.28),rgba(0,0,0,.08) 66%,rgba(0,0,0,0) 70%)}
.dpad .arm,.dpad .hub{position:absolute;background:linear-gradient(#3d3856,#25213b)}
.dpad .arm{box-shadow:inset 0 2px 1px rgba(255,255,255,.16),0 3px 0 #110e22,0 6px 9px rgba(0,0,0,.35);transition:transform .04s}
.dpad .up{left:33%;top:0;width:34%;height:40%;border-radius:7px 7px 0 0}
.dpad .down{left:33%;bottom:0;width:34%;height:40%;border-radius:0 0 7px 7px}
.dpad .left{top:33%;left:0;width:40%;height:34%;border-radius:7px 0 0 7px}
.dpad .right{top:33%;right:0;width:40%;height:34%;border-radius:0 7px 7px 0}
.dpad .hub{left:32%;top:32%;width:36%;height:36%;box-shadow:0 3px 0 #110e22}
.dpad .hub::after{content:'';position:absolute;inset:28%;border-radius:50%;background:radial-gradient(#1c1930,#2c2844)}
.dpad .arm::after{content:'';position:absolute;left:50%;top:50%;border:5px solid transparent;transform:translate(-50%,-50%);opacity:.45}
.dpad .up::after{border-bottom-color:#9d97c9;margin-top:-3px}
.dpad .down::after{border-top-color:#9d97c9;margin-top:3px}
.dpad .left::after{border-right-color:#9d97c9;margin-left:-3px}
.dpad .right::after{border-left-color:#9d97c9;margin-left:3px}
.dpad .arm.pressed{background:linear-gradient(#25213b,#1c192f);box-shadow:inset 0 3px 6px rgba(0,0,0,.6),0 1px 0 #110e22;transform:scale(.96)}
.dpad.t-up{transform:perspective(300px) rotateX(6deg)}
.dpad.t-down{transform:perspective(300px) rotateX(-6deg)}
.dpad.t-left{transform:perspective(300px) rotateY(-6deg)}
.dpad.t-right{transform:perspective(300px) rotateY(6deg)}

/* A / B buttons, angled like the real console */
.ab{grid-area:ab;position:relative;width:calc(var(--bs,58px) * 2 + 34px);height:calc(var(--bs,58px) + 30px);transform:rotate(-22deg);z-index:2}
.ab::before{content:'';position:absolute;left:0;right:0;top:4px;bottom:4px;border-radius:999px;background:rgba(0,0,0,.16);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.25),0 1px 0 rgba(255,255,255,.15)}
.btn{position:absolute;width:var(--bs,58px);height:var(--bs,58px);border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#ffb0be 0%,#ff6684 22%,#e0325a 55%,#a3173a 100%);
  box-shadow:0 4px 0 #6d0f28,0 8px 12px rgba(0,0,0,.38),inset 0 2px 2px rgba(255,255,255,.45),inset 0 -3px 5px rgba(80,0,20,.35);
  display:flex;align-items:center;justify-content:center;transition:transform .04s}
.btn.a{right:9px;top:calc(50% - var(--bs,58px) / 2 - 2px)}.btn.b{left:9px;top:calc(50% - var(--bs,58px) / 2 - 2px)}
.btn span{font:900 19px/1 system-ui,sans-serif;color:rgba(255,255,255,.88);transform:rotate(22deg);text-shadow:0 1px 0 rgba(90,0,30,.6)}
.btn.pressed{transform:translateY(3px) scale(.94);box-shadow:0 1px 0 #6d0f28,inset 0 3px 7px rgba(60,0,15,.55)}

/* Start / Select pills */
.pills{grid-area:pills;display:flex;gap:30px;align-items:flex-end;z-index:2;padding:22px 0 0}
.pill{display:flex;flex-direction:column;align-items:center;gap:6px}
.pill i{display:block;width:48px;height:14px;border-radius:9px;background:linear-gradient(#3d3856,#25213b);
  box-shadow:0 2px 0 #110e22,inset 0 1px 1px rgba(255,255,255,.22);transform:rotate(-22deg);transition:transform .04s}
.pill span{font:800 9px/1 system-ui,sans-serif;color:#d8d3ff;letter-spacing:1px;opacity:.85}
.pill.pressed i{transform:rotate(-22deg) translateY(2px) scale(.95);box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}

/* L / R shoulder buttons along the top edge */
.shoulder{position:absolute;top:0;z-index:3;width:31%;height:calc(env(safe-area-inset-top) + 26px);padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;justify-content:center;font:900 13px/1 system-ui,sans-serif;color:#e4e0ff;
  background:linear-gradient(#5a4ad6,#3b2fa6);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.3),0 3px 6px rgba(0,0,0,.3);transition:transform .04s}
.shoulder.L{left:0;border-radius:0 0 22px 0}.shoulder.R{right:0;border-radius:0 0 0 22px}
.shoulder.pressed{transform:translateY(2px);filter:brightness(.82)}

.speaker{position:absolute;z-index:1;right:calc(env(safe-area-inset-right) + 20px);bottom:calc(env(safe-area-inset-bottom) + 16px);width:58px;height:42px;
  background-image:radial-gradient(circle,#1a1446 1.7px,transparent 2.3px);background-size:9px 9px;transform:rotate(-22deg);opacity:.75}
.mute{position:absolute;z-index:4;left:calc(env(safe-area-inset-left) + 20px);bottom:calc(env(safe-area-inset-bottom) + 18px);width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font:900 16px/1 system-ui,sans-serif;color:#e6e2ff;
  background:linear-gradient(#45408f,#2b2766);box-shadow:0 2px 0 #15123a,inset 0 1px 1px rgba(255,255,255,.25)}
.mute.pressed{transform:translateY(2px)}
.mute.off{color:#ff7d95}
.brand{position:absolute;z-index:1;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 4px);
  font:italic 900 8px/1 system-ui,sans-serif;letter-spacing:3px;color:rgba(255,255,255,.28)}

body.mobile.port .bezel{padding:20px 18px 28px}
body.mobile.port .bezel .ledlbl{display:none}
/* Landscape: classic GBA layout */
body.mobile.land #shell{grid-template-columns:1fr auto 1fr;grid-template-rows:1fr auto;
  grid-template-areas:"dpad screen ab" "dpad pills ab";
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 6px) calc(env(safe-area-inset-left) + 12px)}
body.mobile.land .shoulder{width:21%;height:24px;padding-top:0}
body.mobile.land .speaker{right:calc(env(safe-area-inset-right) + 30px);bottom:calc(env(safe-area-inset-bottom) + 14px)}
body.mobile.land .mute{left:calc(env(safe-area-inset-left) + 26px);bottom:calc(env(safe-area-inset-bottom) + 12px)}
body.mobile.land .pills{padding:0 0 4px;gap:26px}
body.mobile.land .brand{display:none}

/* Tap-to-start overlay (unlocks audio on mobile) */
#tap{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(circle at 50% 40%,rgba(40,30,110,.88),rgba(8,6,24,.94));color:#fff;text-align:center}
#tap.show{display:flex}
#tap .ball{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb36b,#e8762a 50%,#a9471a);
  position:relative;animation:tb 0.9s cubic-bezier(.3,0,.7,1) infinite alternate;box-shadow:0 4px 0 rgba(0,0,0,.3)}
#tap .ball::before,#tap .ball::after{content:'';position:absolute;background:#3b1a0a}
#tap .ball::before{left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px}
#tap .ball::after{top:50%;left:0;right:0;height:3px;margin-top:-1.5px}
#tap h1{font:900 22px/1.1 ui-monospace,monospace;letter-spacing:4px;animation:pulse 1.1s ease-in-out infinite}
#tap p{font:700 11px/1.4 ui-monospace,monospace;letter-spacing:2px;color:#b9b3ff}
@keyframes tb{from{transform:translateY(-26px)}to{transform:translateY(8px) scale(1.06,.92)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
</style>
</head>
<body>
<!-- PC stage: the canvas lives here on keyboard devices -->
<div id="pcStage">
  <div id="screen">
    <canvas id="game" width="240" height="160"></canvas>
    <div id="meme"></div>
  </div>
</div>

<!-- Mobile handheld shell (built in CSS; the #screen element is moved into #screenSlot on touch devices) -->
<div id="shell">
  <div class="shoulder L" data-btn="L">L</div>
  <div class="shoulder R" data-btn="R">R</div>
  <div class="bezel">
    <span class="stripes"></span>
    <span class="led"></span><span class="ledlbl">POWER</span>
    <div id="screenSlot"></div>
    <div class="wordmark">HOOP QUEST <b>ADVANCE</b></div>
  </div>
  <div class="dpad" id="dpad">
    <div class="arm up" data-arm="up"></div><div class="arm down" data-arm="down"></div>
    <div class="arm left" data-arm="left"></div><div class="arm right" data-arm="right"></div>
    <div class="hub"></div>
  </div>
  <div class="ab" id="ab">
    <div class="btn b" data-btn="B"><span>B</span></div>
    <div class="btn a" data-btn="A"><span>A</span></div>
  </div>
  <div class="pills">
    <div class="pill" data-btn="SELECT"><i></i><span>SELECT</span></div>
    <div class="pill" data-btn="START"><i></i><span>START</span></div>
  </div>
  <div class="speaker"></div>
  <div class="mute" id="muteBtn" title="Mute">&#9835;</div>
  <div class="brand">TANISHK</div>
</div>

<div id="tap"><div class="ball"></div><h1>TAP TO START</h1><p>TAP ANYWHERE TO TURN ON<br>THE SOUND &amp; PLAY</p></div>

<script>
'use strict';
/* ==========================================================================
   HOOP QUEST: THE LEGEND OF API BADDE
   A birthday game for Sarthak Nirula, from Tanishk.
   Single file. Everything (art, music, sound) is generated in code.

   ==========================================================================
   CONFIG / DIALOGUE  —  edit any text in the game here.
   Dialogue lines written as "Name: text" get a speaker name tab.
   ========================================================================== */
const CONFIG = {
  GAME_TITLE: 'HOOP QUEST',
  GAME_SUBTITLE: 'THE LEGEND OF API BADDE',
  STUDIO: 'TANISHK GAMES',
  HERO: 'SARTHAK',

  // ---- Meme moment ---------------------------------------------------------
  // Paste an image URL (or a base64 data URI) here to show your own meme image

  MEME_IMAGE_URL: '',
  MEME_CAPTION: 'for you, bhai',

  // ---- Custom audio hook (optional) ---------------------------------------
  // Paste a hosted audio URL (mp3/ogg/wav) or a base64 data URI
  // (e.g. "data:audio/mpeg;base64,....") into any slot below.
  //   forestTrack -> replaces the synthesized Maroon Forest music
  //   endingTrack -> replaces the Punjabi Angithi / ending + credits music
  //   memeSound   -> plays once during the hamster meme moment
  // Leave a slot empty ("") to use the built-in chiptune. If a file fails to

  // ---- Ending ---------------------------------------------------------------
  ENDING_TITLE: 'API BADDE',
  BIRTHDAY_MESSAGE: [
    'Thank you for being the friend that has always been there for me. The person I look up to, the one who has taught me everything. And in the moments I was alone, he gave me company. And in the times I think about my blessings, I think about him. And I will walk this earth always wondering why God has blessed me with such a great friend.',
    'Happy birthday to the best friend in the whole world.'
  ],
  ENDING_LINE: 'yk where this is from nga',
  FROM_LINE: 'From Tanishk',

  // ---- Misc -----------------------------------------------------------------
  SAVE_KEY: 'hoopquest_save_v1',
  MUTE_KEY: 'hoopquest_mute_v1',
  ENCOUNTER_RATE: 0.13,     // chance per step in Maroon Forest bushes
  ENCOUNTER_COOLDOWN: 4     // minimum steps between Animal encounters

const DIALOGUE = {
  // ---------------- Sarthak's room ----------------
  roomIntro: [
    '...',
    '*BZZT* *BZZT*',
    'Sarthak wakes up. The sun is out. The birds are singing (badly).',

  roomBed: ['Your bed. It whispers "five more minutes". Not today, bed.'],
  roomDesk: ['A calendar. Today is circled 47 times in red marker.', 'Someone wrote "PARTY @ PUNJABI ANGITHI - TONIGHT" on it. The handwriting is terrible. Classic Tanishk.'],

  // ---------------- Home Town ----------------
  tanishkFirst: [

    'Tanishk: Okay so. Small problem. Tiny. Microscopic.',
    'Tanishk: Every single basketball in Delhi-Town has VANISHED.',
    'Tanishk: Witnesses say a guy made entirely of bricks did it. Calls himself... THE BRICKLORD.',

    'Tanishk: And your birthday feast at Punjabi Angithi ends TONIGHT. No balls, no butter chicken. That is the law.',

  tanishkNoBall: ['Tanishk: Garden. South. Fenced bit. Ball. Go. I believe in you. Mostly.'],
  tanishkHasBall: [
    'Tanishk: YOU FOUND IT! Look at you. Natural-born ball finder.',

  ],
  tanishkTutorialWin: [
    'Tanishk: Bro cooked me. On his own birthday. Disrespectful. I\'m so proud.',
    'Tanishk: Court Street is EAST. The street hoopers there are holding the next balls.',
    'Tanishk: I\'ll meet you there. I know a shortcut. (It is the same road.)'
  ],
  tanishkAfter: ['Tanishk: Why are you still here? EAST! The sun rises there and so do ballers.'],

  aunty: ['Aunty: Happy birthday beta! So tall now! Are you eating properly? When is the shaadi?', 'Aunty: Just kidding! Go have fun. And wear a sweater, it is chilly.'],
  kid: ['Kid: I saw a guy made of BRICKS take my ball!', 'Kid: He went "CLANK CLANK HAHAHA". Worst laugh ever. Get him, bhaiya.'],
  dog: ['Dog: Woof.', 'He looks like he knows where the balls are. He does not.'],
  homeSign: ['DELHI-TOWN', 'Population: Sarthak, one dog, infinite aunties.'],

  gardenSign: ['SHARMA JI\'S GARDEN', 'Do not touch the tomatoes. I have counted them. - Sharma ji'],

  devWin: ['Dev: Bro had the birthday buff. Unfair. Take the ball, legend.'],
  devAfter: ['Dev: I\'m gonna go practice. And cry. Mostly practice.'],
  aanyaPre: ['Aanya: My crossover has a 100% ankle-break rate. Insurance companies hate me.'],

  kabirLocked: ['Captain Kabir: Nobody gets to the forest without beating my squad first.', 'Captain Kabir: Rules are rules. I made them. This morning.'],
  kabirPre: ['Captain Kabir: So you beat Dev and Aanya. Cute.', 'Captain Kabir: Now face the CAPTAIN. The C stands for Crossover. And Captain.'],

const Trans = {
  active: false, t: 0, dur: 20, phase: 0, type: 'fade', mid: null, done: null, cx: 120, cy: 80, color: '#000',
  go(type, mid, o = {}) { if (this.active) return; this.active = true; this.type = type; this.mid = mid; this.done = o.done || null; this.t = 0;
    this.dur = o.dur || (type === 'iris' ? 22 : 20); this.phase = 0; this.cx = o.cx ?? 120; this.cy = o.cy ?? 80; this.color = o.color || '#000'; },
  update() { if (!this.active) return; this.t++;
    if (this.phase === 0 && this.t >= this.dur) { this.phase = 1; this.t = 0; const m = this.mid; this.mid = null; if (m) m(); this.hold = 6; }
    else if (this.phase === 1) { if (--this.hold <= 0) { this.phase = 2; this.t = 0; } }
    else if (this.phase === 2 && this.t >= this.dur) { this.active = false; const d = this.done; this.done = null; Input.consume(); if (d) d(); } },
  amount() { if (!this.active) return 0; if (this.phase === 1) return 1; const p = clamp(this.t / this.dur, 0, 1); return this.phase === 0 ? p : 1 - p; },
  render(g) { if (!this.active) return; const a = this.amount();
    if (this.type === 'iris') { const maxR = 160; const r = (1 - a) * maxR; g.save(); g.fillStyle = this.color; g.beginPath(); g.rect(0, 0, W, H);
      if (r > .5) { // pixel-stepped circle hole
        g.moveTo(this.cx + r, this.cy); g.arc(this.cx, this.cy, r, 0, Math.PI * 2, true); }
      g.fill('evenodd'); g.restore(); }
    else if (this.type === 'stripes') { g.fillStyle = this.color;
      for (let i = 0; i < H / 8; i++) { const k = clamp(a * 1.4 - (i % 5) * .08, 0, 1); const w = Math.ceil(k * W);
        if (i % 2) g.fillRect(W - w, i * 8, w, 8); else g.fillRect(0, i * 8, w, 8); } }
    else { g.save(); g.globalAlpha = Math.round(a * 8) / 8; g.fillStyle = this.color; g.fillRect(0, 0, W, H); g.restore(); } }
};

  ox() { return this.t > 0 ? Math.round((Math.random() * 2 - 1) * this.mag) : 0; }, oy() { return this.t > 0 ? Math.round((Math.random() * 2 - 1) * this.mag) : 0; } };

  update() { for (const p of this.list) { p.vx *= p.drag || 1; p.vy *= p.drag || 1; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--; } this.list = this.list.filter(p => p.life > 0 && p.y < H + 20); },

/* ==========================================================================
   UI HELPERS  (GBA-style boxes)
   ========================================================================== */
/* Gen-3 style boxes.
   light : dialogue text box (dark slate double border, white inside)
   menu  : start-menu / choice box (thin dark border, white inside)
   panel : duel name/score panel (cream, dark border, shaded bottom-right)
   wood  : area-name signboard
   dark  : navy info box (toasts, banners) */
function box(g, x, y, w, h, style = 'light') {
  const R = (xx, yy, ww, hh, col) => { g.fillStyle = col; g.fillRect(xx, yy, ww, hh); };
  const rr = (o, col) => { R(x + o + 1, y + o, w - 2 * o - 2, h - 2 * o, col); R(x + o, y + o + 1, w - 2 * o, h - 2 * o - 2, col); };
  if (style === 'light') { rr(0, '#283040'); rr(1, '#5a6a9a'); R(x + 2, y + 2, w - 4, 1, '#7888b8'); rr(3, '#c8d2ee'); rr(4, '#f8f8f8'); }
  else if (style === 'menu') { rr(0, '#283040'); rr(1, '#d0d8e8'); rr(2, '#f8f8f8'); }
  else if (style === 'panel') { rr(0, '#283040'); rr(1, '#f8f4dc'); R(x + 2, y + h - 3, w - 4, 1, '#d8d0a8'); R(x + w - 3, y + 2, 1, h - 4, '#d8d0a8'); R(x + 2, y + 2, w - 5, 1, '#ffffff'); }
  else if (style === 'wood') { rr(0, '#3a2414'); rr(1, '#c4905a'); rr(2, '#a06b3d'); for (let yy = y + 6; yy < y + h - 3; yy += 5) R(x + 3, yy, w - 6, 1, '#8a5a30'); R(x + 3, y + 3, w - 6, 1, '#d8a870'); }
  else { rr(0, '#141428'); rr(1, '#8890c8'); rr(2, '#283048'); }
}
const SPEAKER_COLORS = { 'Tanishk': '#3b6fd6', 'Coach Muthi': '#7a4aa8', 'BRICKLORD': '#b0302a', 'Captain Kabir': '#c48f25', 'Dev': '#d23c3c', 'Aanya': '#139a8e', 'Shashank': '#7a7a30', 'Yash': '#c0309c', 'Simerjeet': '#2a6fd6', 'Prabhkirat': '#cc3333', 'Alpha Animal': '#8f2d44' };

/* ==========================================================================
   DIALOGUE  (typewriter, A to advance, blinking ▼, optional choices)
   ========================================================================== */
const Dialog = {
  active: false, pages: [], idx: 0, shown: 0, acc: 0, done: null, frame: 0, choice: null, cIdx: 0, opened: 0,
  open(lines, done, o = {}) {
    const pages = [];
    for (const raw of (Array.isArray(lines) ? lines : [lines])) {
      let who = null, t = raw;
      if (!o.plain) { const m = /^([A-Za-z][A-Za-z .'()-]{0,32}): (.+)$/.exec(raw); if (m) { who = m[1]; t = m[2]; } }
      const ls = wrapPx(t, 212); for (let i = 0; i < ls.length; i += 3) pages.push({ who, lines: ls.slice(i, i + 3) });
    }
    this.pages = pages; this.idx = 0; this.shown = 0; this.acc = 0; this.done = done || null; this.active = true; this.frame = 0;
    this.choice = o.choice || null; this.cIdx = 0; this.onChoose = o.onChoose || null; this.opened = 2;
  },
  pageLen() { return this.pages[this.idx].lines.join('').length; },
  update() {
    if (!this.active) return; this.frame++;
    if (this.opened > 0) { this.opened--; Input.consume('A'); Input.consume('B'); return; }
    const len = this.pageLen();
    if (this.shown < len) {
      const fast = Input.isHeld('A') || Input.isHeld('B');
      this.acc += fast ? 2.4 : 0.9;
      while (this.acc >= 1 && this.shown < len) { this.acc--; this.shown++; const ch = this.pages[this.idx].lines.join('')[this.shown - 1]; if (ch !== ' ' && this.shown % 2) sfx('tick'); }
      if (Input.pressed('A') && this.shown > 2) { this.shown = len; Input.consume('A'); }
      return;
    }
    const last = this.idx === this.pages.length - 1;
    if (last && this.choice) {
      if (Input.pressed('up') || Input.pressed('down')) { this.cIdx = (this.cIdx + 1) % this.choice.length; sfx('move'); }
      if (Input.pressed('A')) { Input.consume('A'); sfx('confirm'); const c = this.cIdx, cb = this.onChoose; this.close(); if (cb) cb(c); }
      return;
    }
    if (Input.pressed('A') || Input.pressed('B')) {
      Input.consume('A'); Input.consume('B');
      if (!last) { this.idx++; this.shown = 0; this.acc = 0; sfx('tick'); }
      else { this.close(); }
    }
  },
  close() { this.active = false; const d = this.done; this.done = null; Input.consume(); if (d) d(); },
  render(g) {
    if (!this.active || !this.pages.length) return;
    const p = this.pages[this.idx]; const bx = 2, by = 112, bw = 236, bh = 46;
    if (p.who) { const name = p.who.slice(0, 32); const nw = textW(name) + 14; const col = SPEAKER_COLORS[p.who] || '#3a4a7a';
      box(g, bx + 6, by - 12, nw, 16, 'menu'); text(g, name, bx + 13, by - 8, col, { shadow: '#d0d0c8' }); }
    box(g, bx, by, bw, bh);
    let left = this.shown;
    for (let i = 0; i < p.lines.length; i++) { const l = p.lines[i]; const s2 = l.slice(0, Math.max(0, left)); left -= l.length;
      text(g, s2, bx + 10, by + 7 + i * 12, '#484850', { shadow: '#d0d0c8' }); }
    if (this.shown >= this.pageLen() && !(this.idx === this.pages.length - 1 && this.choice)) {
      if ((this.frame >> 4) % 2 === 0) text(g, '▼', bx + bw - 15, by + bh - 13 + ((this.frame >> 3) % 2), '#e05040', { shadow: '#f0b8a8' });
    }
    if (this.choice && this.idx === this.pages.length - 1 && this.shown >= this.pageLen()) {
      const cw = Math.max(...this.choice.map(textW)) + 24, ch = this.choice.length * 13 + 10; const cx = 238 - cw, cy = by - ch - 1;
      box(g, cx, cy, cw, ch, 'menu');
      this.choice.forEach((c, i) => { text(g, c, cx + 15, cy + 6 + i * 13, '#484850', { shadow: '#d0d0c8' }); if (i === this.cIdx) text(g, '▶', cx + 6, cy + 6 + i * 13, '#283040'); });
    }
  }
};

function questText() {
  const f = flag;
  if (f('gameDone')) return "Rematch: knock on Tanishk's door (east house).";
  if (f('boss')) return metCount() < 5 ? 'Party! Talk to everyone at Punjabi Angithi.' : 'Find Tanishk. He looks suspicious.';
  if (!f('metTanishk')) return 'Go outside and talk to Tanishk.';
  if (!f('ball1')) return "Find the ball in Sharma ji's garden (south of town).";
  if (!f('tutorialDone')) return 'Show Tanishk the ball. Practice duel!';
  if (!f('dev') || !f('aanya')) return 'Court Street (east): beat the hoopers on both courts.';
  if (!f('kabir')) return 'Duel Captain Kabir at the north path of Court Street.';
  if (!f('alpha')) return 'Cross Maroon Forest. The cave is to the north-west.';
  if (!f('gateA') || !f('gateB')) return 'Muthi Cave: push the rocks onto the glowing plates. (SELECT resets)';
  if (!f('bill')) return 'Fortress: open the chest on the left. Tanishk insists.';
  return 'Defeat THE BRICKLORD!';
}

const OW = {
  key: null, map: null, rows: null, w: 0, h: 0, ents: [], p: null, cam: { x: 0, y: 0 }, frame: 0, banner: null, locked: false,
  steps: 0, timers: [], menu: null, bubble: null, rustle: null, turnDelay: 0, bumpCd: 0,
  load(key, x, y, dir) {
    const m = MAPS[key]; this.key = key; this.map = m; S.map = key;
    this.w = Math.max(...m.rows.map(r => r.length)); this.h = m.rows.length;
    this.rows = m.rows.map(r => (r + 'v'.repeat(this.w)).slice(0, this.w));
    this.cells = m._cells || (m._cells = buildMapCells(this.rows));
    this.ents = m.ents(); for (const e of this.ents) { e.bob = Math.random() * 200 | 0; e.wt = 60 + Math.random() * 120 | 0; }
    this.p = { x, y, dir, fx: x, fy: y, t: 1, moving: false, alt: false, run: false };
    S.x = x; S.y = y; S.dir = dir;
    this.timers = []; this.locked = false; this.menu = null; this.bubble = null; this.steps = 0;
    this.banner = m.party ? null : { text: m.name, t: 0 };
    Audio.playMusic(m.music);
    this.updateCam();
    if (m.onEnter) m.onEnter();
  },
  enter(arg) {
    if (arg && arg.resume) { Audio.playMusic(this.map.music); this.locked = false; return; }
    this.load(arg.map, arg.x, arg.y, arg.dir);
  },
  exit() { Parts.clear(); },
  wait(frames, fn) { this.timers.push({ t: frames, fn }); },
  tile(x, y) { return (x < 0 || y < 0 || x >= this.w || y >= this.h) ? 'v' : this.rows[y][x]; },
  vis(e) { if (e.kind === 'gate') return !flag(e.flag); return !(e.hide && e.hide()); },
  entAt(x, y, solidOnly) {
    for (const e of this.ents) { if (!this.vis(e)) continue; if (solidOnly && !e.solid) continue;
      const w = e.w || 1; if (y === e.y && x >= e.x && x < e.x + w) return e; }
    return null;
  },
  blocked(x, y) { return SOLID.has(this.tile(x, y)) || !!this.entAt(x, y, true) || this.tile(x, y) === 'v'; },
  warpAt(x, y) { return (this.map.warps || []).find(w => w.x === x && w.y === y); },
  walk(e, dirs, done) { e.path = dirs.slice(); e.pathDone = done; this.locked = true; },
  updateCam() {
    const p = this.p; const px = lerp(p.fx, p.x, p.t) * TS + 8, py = lerp(p.fy, p.y, p.t) * TS + 8;
    const mw = this.w * TS, mh = this.h * TS;
    this.cam.x = mw <= W ? Math.round((mw - W) / 2) : Math.round(clamp(px - W / 2, 0, mw - W));
    this.cam.y = mh <= H ? Math.round((mh - H) / 2) : Math.round(clamp(py - H / 2, 0, mh - H));
  },
  update() {
    this.frame++;
    for (const t of this.timers.slice()) if (--t.t <= 0) { this.timers.splice(this.timers.indexOf(t), 1); t.fn(); }
    if (this.banner) { this.banner.t++; if (this.banner.t > 150) this.banner = null; }
    if (this.bubble && --this.bubble.t <= 0) this.bubble = null;
    if (this.rustle && --this.rustle.t <= 0) this.rustle = null;
    if (this.bumpCd > 0) this.bumpCd--;
    this.updateEnts();
    if (this.map.party && this.frame % 50 === 0) Parts.confetti(20 + Math.random() * 200, -4, 10, 1.2);
    const p = this.p;
    if (p.moving) {
      p.t += p.run ? 1 / 8 : 1 / 16;
      if (p.t >= 1) { p.t = 1; p.moving = false; this.onStep(); }
    }
    if (Dialog.active) { this.updateCam(); return; }
    if (this.menu) { this.updateMenu(); return; }
    if (!p.moving && !this.locked && !Trans.active) this.control();
    this.updateCam();
  },
  updateEnts() {
    for (const e of this.ents) {
      if (e.mv) { e.mv.t += e.mv.sp; if (e.mv.t >= 1) e.mv = null; }
      if (e.path && !e.mv) {
        if (e.path.length) { const d = e.path.shift(); e.dir = d; e.mv = { fx: e.x, fy: e.y, t: 0, sp: 1 / 12 }; e.x += DX[d]; e.y += DY[d]; e.alt = !e.alt; }
        else { e.path = null; this.locked = false; const d = e.pathDone; e.pathDone = null; if (d) d(); }
      }
      if (e.wander && !e.path && !Dialog.active && --e.wt <= 0) { e.wt = 90 + Math.random() * 160 | 0; e.dir = pick([0, 0, 1, 2, 3]); }
    }
  },
  control() {
    const p = this.p;
    if (Input.pressed('START')) { sfx('confirm'); this.menu = { idx: 0, page: 'main' }; Input.consume('START'); return; }
    if (Input.pressed('L')) { sfx('confirm'); say(['QUEST: ' + questText()], null, { plain: true }); return; }
    if (Input.pressed('SELECT') && this.map.cave) { this.resetBlocks(); return; }
    if (Input.pressed('A')) { const e = this.entAt(p.x + DX[p.dir], p.y + DY[p.dir]);
      if (e && e.talk) { if (e.kind === 'npc' || e.kind === 'dog') { if (e.kind === 'npc') e.dir = OPP[p.dir]; } Input.consume('A'); e.talk(); return; } }
    const d = Input.dir();
    if (d < 0) { this.turnDelay = 0; return; }
    if (d !== p.dir && !Input.isHeld(DIRNAMES[p.dir])) { p.dir = d; this.turnDelay = 5; return; }
    if (this.turnDelay > 0) { this.turnDelay--; return; }
    p.dir = d; this.tryMove(d);
  },
  tryMove(d) {
    const p = this.p, nx = p.x + DX[d], ny = p.y + DY[d];
    const w = this.warpAt(nx, ny);
    if (w && w.cond && !w.cond()) { sfx('bump'); say(w.fail()); return; }
    const e = this.entAt(nx, ny, true);
    if (e && e.kind === 'block') {
      const bx = nx + DX[d], by = ny + DY[d];
      const nb = (this.map.noBlock || []).includes(bx + ',' + by);
      if (!nb && this.tile(bx, by) === 'r' && !this.entAt(bx, by, true) && !(bx === p.x && by === p.y)) {
        e.mv = { fx: e.x, fy: e.y, t: 0, sp: 1 / 16 }; e.x = bx; e.y = by; sfx('push'); this.startMove(nx, ny, false); this.wait(17, () => this.checkPlates()); return;
      }
      if (this.bumpCd <= 0) { sfx('bump'); this.bumpCd = 14; } return;
    }
    if (this.blocked(nx, ny)) { if (this.bumpCd <= 0) { sfx('bump'); this.bumpCd = 14; } return; }
    this.startMove(nx, ny, Input.isHeld('B') || Input.isHeld('R'));
  },
  startMove(nx, ny, run) { const p = this.p; p.fx = p.x; p.fy = p.y; p.x = nx; p.y = ny; p.t = 0; p.moving = true; p.run = run; p.alt = !p.alt; },
  onStep() {
    const p = this.p; S.x = p.x; S.y = p.y; S.dir = p.dir; sfx('step');
    const w = this.warpAt(p.x, p.y);
    if (w) { sfx('door'); this.locked = true;
      const sx = p.x * TS + 8 - this.cam.x, sy = p.y * TS + 4 - this.cam.y;
      Trans.go('fade', () => { this.load(w.to, w.tx, w.ty, w.dir); Save.write(); }, { dur: 16 }); return; }
    if (this.map.encounters && this.tile(p.x, p.y) === 'P') {
      this.steps++;
      if (this.steps >= CONFIG.ENCOUNTER_COOLDOWN && Math.random() < CONFIG.ENCOUNTER_RATE) { this.steps = 0; this.encounter(); }
    }
  },
  encounter() {
    const p = this.p; this.locked = true; this.rustle = { x: p.x, y: p.y, t: 40 }; this.bubble = { t: 46 }; sfx('alert');
    this.wait(28, () => sfx('howl'));
    const i = Math.random() * ANIMALS.length | 0, a = ANIMALS[i];
    const lvl = (flag('alpha') ? .1 : 0);
    this.wait(50, () => startDuel({ key: 'animal', name: a.name, short: a.short, sprite: 'animal', animalIdx: i, bg: 'forest', target: 2, eTarget: 3,
      speed: .95 + lvl, green: .16, yellow: .14, acc: .4, block: .22, music: 'forestBattle', fast: 'forestBattle', animal: true,
      intro: [D.animalAppears, a.intro] }, () => say(D.animalWin)));
  },
  checkPlates() {
    for (const gname of ['gateA', 'gateB']) {
      if (flag(gname)) continue;
      const plates = this.ents.filter(e => e.kind === 'plate' && e.gate === gname); if (!plates.length) continue;
      if (plates.every(pl => this.ents.some(b => b.kind === 'block' && b.x === pl.x && b.y === pl.y))) {
        setFlag(gname); Save.write(); sfx('gate'); Shake.start(24, 2); say([D.gateOpened], null, { plain: true });
      }
    }
  },
  resetBlocks() {
    const p = this.p; let blockedReset = false;
    for (const b of this.ents) if (b.kind === 'block') {
      if (p.x === b.hx && p.y === b.hy) { blockedReset = true; continue; }
      const other = this.ents.find(o => o !== b && o.kind === 'block' && o.x === b.hx && o.y === b.hy);
      if (other) continue; b.x = b.hx; b.y = b.hy; b.mv = null;
    }
    sfx('whoosh'); Shake.start(8, 1); say([blockedReset ? D.resetBlocked : D.resetRocks], null, { plain: true });
  },
  /* ---------------- Start menu ---------------- */
  updateMenu() {
    const m = this.menu; const items = this.menuItems();
    if (m.page !== 'main') { if (Input.pressed('A') || Input.pressed('B') || Input.pressed('START')) { sfx('cancel'); m.page = 'main'; Input.consume(); } return; }
    if (Input.pressed('up')) { m.idx = (m.idx + items.length - 1) % items.length; sfx('move'); }
    if (Input.pressed('down')) { m.idx = (m.idx + 1) % items.length; sfx('move'); }
    if (Input.pressed('B') || Input.pressed('START')) { sfx('cancel'); this.menu = null; Input.consume(); return; }
    if (Input.pressed('A')) { Input.consume('A'); const it = items[m.idx];
      if (it === 'RESUME') { sfx('cancel'); this.menu = null; }
      else if (it === 'QUEST') { sfx('confirm'); m.page = 'quest'; }
      else if (it === 'BAG') { sfx('confirm'); m.page = 'bag'; }
      else if (it === 'CONTROLS') { sfx('confirm'); m.page = 'controls'; }
      else if (it.startsWith('SOUND')) { toggleMute(); sfx('confirm'); }
      else if (it === 'SAVE') { Save.write(); sfx('pickup'); this.menu = null; say(['Game saved! (It also autosaves, but this felt good, right?)'], null, { plain: true }); }
    }
  },
  menuItems() { return ['RESUME', 'QUEST', 'BAG', 'CONTROLS', 'SOUND: ' + (Audio.muted ? 'OFF' : 'ON'), 'SAVE']; },
  renderMenu(g) {
    const m = this.menu; const items = this.menuItems();
    if (m.page === 'main') {
      const bw = 88, bh = items.length * 14 + 10; box(g, W - bw - 2, 2, bw, bh, 'menu');
      items.forEach((it, i) => { text(g, it, W - bw + 12, 8 + i * 14, '#484850', { shadow: '#d0d0c8' }); if (i === m.idx) text(g, '▶', W - bw + 4, 8 + i * 14, '#283040'); });
      return;
    }
    box(g, 6, 6, 228, 148, 'menu');
    if (m.page === 'quest') {
      text(g, 'QUEST LOG', 120, 18, '#2b3466', { align: 'center' });
      wrap(questText(), 32).forEach((l, i) => text(g, l, 22, 38 + i * 12, '#383848', { shadow: '#d0d0c4' }));
      text(g, 'Area: ' + this.map.name, 22, 110, '#5a5a6a');
    } else if (m.page === 'bag') {
      text(g, 'BAG', 120, 18, '#2b3466', { align: 'center' });
      g.drawImage(ITEMS.ball[(this.frame >> 3) % 4], 24, 38); text(g, 'Basketballs  x' + S.balls + ' / 6', 38, 37, '#383848', { shadow: '#d0d0c4' });
      text(g, '★', 25, 53, '#e0a020'); text(g, 'Shots Made   ' + S.shots, 38, 53, '#383848', { shadow: '#d0d0c4' });
      if (flag('bill')) { g.drawImage(ITEMS.bill, 22, 66); text(g, 'Punjabi Angithi Bill', 38, 69, '#383848', { shadow: '#d0d0c4' }); text(g, '(do not read it out loud)', 38, 80, '#7a7a8a'); }
      text(g, 'Friendship  MAX ♥', 38, 100, '#c0304a');
    } else if (m.page === 'controls') {
      text(g, 'CONTROLS', 120, 16, '#2b3466', { align: 'center' });
      const L = IS_MOBILE ? [['D-PAD', 'Move'], ['A', 'Talk / Shoot / OK'], ['B', 'Back / hold to run'], ['START', 'Menu'], ['SELECT', 'Reset cave rocks'], ['L', 'Quest hint'], ['R', 'Hold to run'], ['♪ button', 'Mute']]
        : [['Arrows/WASD', 'Move'], ['Z or J', 'A: Talk / Shoot'], ['X or K', 'B: Back / Run'], ['Enter', 'START: Menu'], ['Shift', 'SELECT: Reset'], ['M', 'Mute']];
      L.forEach(([k, v], i) => { text(g, k, 18, 32 + i * 13, '#c0304a'); text(g, v, 100, 32 + i * 13, '#383848', { shadow: '#d0d0c4' }); });
    }
    text(g, 'B: BACK', 222, 140, '#7a7a8a', { align: 'right' });
  },
  /* ---------------- rendering ---------------- */
  render(g) {
    const cx = this.cam.x, cy = this.cam.y; const f = this.frame;
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    const x0 = Math.floor(cx / TS), y0 = Math.floor(cy / TS);
    for (let ty = y0; ty <= y0 + 11; ty++) for (let tx = x0; tx <= x0 + 16; tx++) {
      if (tx < 0 || ty < 0 || tx >= this.w || ty >= this.h) continue;
      const cell = this.cells[ty][tx]; let img;
      if (cell.rustle) img = cell.imgs[(this.rustle && this.rustle.x === tx && this.rustle.y === ty) ? (f >> 2) & 1 : 0];
      else img = cell.imgs.length > 1 ? cell.imgs[Math.floor(f / cell.rate) % cell.imgs.length] : cell.imgs[0];
      g.drawImage(img, tx * TS - cx, ty * TS - cy);
    }
    // floor-level entities
    for (const e of this.ents) { if (!this.vis(e)) continue;
      if (e.kind === 'plate') { const on = this.ents.some(b => b.kind === 'block' && b.x === e.x && b.y === e.y && !b.mv); g.drawImage(ITEMS.plate[on ? 1 : 0][(f >> 5) & 1], e.x * TS - cx, e.y * TS - cy); }
      if (e.kind === 'gate') g.drawImage(ITEMS.gate, e.x * TS - cx, e.y * TS - cy); }
    // y-sorted sprites
    const list = [];

    for (let i = 0; i < 4; i++) { const x = ((i * 74 - this.t * .25) % 300 + 300) % 300 - 40; g.drawImage(ITEMS.cloud, Math.round(x), 70 + (i % 2) * 10); }
    for (let i = 0; i < 3; i++) { const x = ((i * 110 + 30 - this.t * .5) % 330 + 330) % 330 - 50; g.drawImage(ITEMS.cloud, Math.round(x), 46 + (i % 2) * 12, 51, 21); }
    // court floor
    g.fillStyle = C.court; g.fillRect(0, 124, W, 36); g.fillStyle = C.court2; for (let x = 3; x < W; x += 8) g.fillRect(x, 124, 1, 36);
    g.fillStyle = C.court3; g.fillRect(0, 124, W, 1); g.fillStyle = C.courtLine; g.fillRect(0, 130, W, 2);
    // basketball sprite bouncing
    const b = this.ball; const sq = b.sq ? 2 : 0; g.fillStyle = C.shadow; g.fillRect(Math.round(b.x) - 6, 137, 12, 3);
    g.drawImage(ITEMS.ball[(this.t >> 2) % 4], Math.round(b.x) - 8 - sq, Math.round(b.y) - 8 + sq * 2, 16 + sq * 2, 16 - sq * 2);
    // logo: dark outline + 2-tone bevel (light top half, darker bottom half)
    const title = CONFIG.GAME_TITLE; const sc = 3; const tw = textW(title) * sc; let x = Math.round(120 - tw / 2);
    const drop = clamp(this.t / 40, 0, 1); const baseY = Math.round(lerp(-40, 12, easeOutBounce(drop)));
    for (const ch of title) { const y = baseY + Math.round(Math.sin(this.t / 14 + x * .03) * 2);
      text(g, ch, x + 2, y + 3, '#283040', { scale: sc });
      text(g, ch, x, y, '#f8d048', { scale: sc, outline: '#283040', od: 2 });
      g.save(); g.beginPath(); g.rect(x - 2, y + 4 * sc, GW * sc + 4, 6 * sc); g.clip(); text(g, ch, x, y, '#e87828', { scale: sc }); g.restore();
      g.fillStyle = 'rgba(255,255,255,.7)'; x += glyphAdv(ch) * sc; }
    if (this.t > 40) { box(g, 40, 48, 160, 18, 'menu'); text(g, CONFIG.GAME_SUBTITLE, 120, 52, '#e05040', { align: 'center', shadow: '#f0c8b8' }); }
    if (this.menu) { const m = this.menu; const bw = 120, bh = m.items.length * 14 + 10; box(g, 120 - bw / 2, 72, bw, bh, 'menu');
      m.items.forEach((it, i) => { text(g, it, 120 - bw / 2 + 16, 78 + i * 14, '#484850', { shadow: '#d0d0c8' }); if (i === m.idx) text(g, '▶', 120 - bw / 2 + 6, 78 + i * 14, '#283040'); }); }
    else if (this.t > 50 && (this.t >> 5) % 2 === 0) text(g, 'PRESS START', 120, 84, '#ffffff', { align: 'center', outline: '#283040', scale: 1 });
    text(g, '(C) 2026 ' + CONFIG.STUDIO + '  ♥  FOR SARTHAK', 120, 148, '#fff8e0', { align: 'center', shadow: '#8a4a20' });
  }
};

/* ==========================================================================
   ENDING: balls return -> Punjabi Angithi party (overworld) -> API BADDE
           -> hamster meme -> credits message -> final line -> From Tanishk
   ========================================================================== */
const BallsReturn = {
  enter() { this.t = 0; this.balls = []; Audio.playMusic('title'); this.bg = duelBG('home'); },
  update() {
    this.t++;
    if (this.t < 200 && this.t % 4 === 0) this.balls.push({ x: Math.random() * W, y: -10, vx: (Math.random() - .5) * 1.5, vy: Math.random() * 1.5, b: 0, f: Math.random() * 4 | 0 });
    for (const b of this.balls) { b.vy += .2; b.x += b.vx; b.y += b.vy; if (b.y > 100 + (b.f % 3) * 7) { b.y = 100 + (b.f % 3) * 7; b.vy *= -.62; b.b++; if (b.b < 3 && Math.random() < .25) sfx('bounce'); } }
    if (this.t === 60) { Parts.confetti(120, 30, 40, 3); say(D.ballsReturn, () => { this.t = 9999; Trans.go('iris', () => { Save.write(); setScene(OW, { map: 'angithi', x: 7, y: 7, dir: 3 }); }, { dur: 30 }); }); }
  },
  render(g) {
    g.drawImage(this.bg, 0, 0); drawHoop(g, (this.t % 40) < 20 ? 1 : 0, this.t);
    for (const b of this.balls) { g.fillStyle = 'rgba(20,10,30,.25)'; g.fillRect(Math.round(b.x) - 3, 104 + (b.f % 3) * 7, 7, 2); g.drawImage(ITEMS.ball[(b.f + (this.t >> 2)) % 4], Math.round(b.x) - 4, Math.round(b.y) - 4); }
    if (this.t < 200) text(g, 'THE BALLS ARE BACK!', 120, 30, '#ffd34a', { align: 'center', scale: 2, outline: C.ol });
  }
};

const Ending = {
  enter() {
    this.stage = 'title'; this.t = 0; this.f = 0; Audio.playMusic('ending', .3);
    const lines = []; CONFIG.BIRTHDAY_MESSAGE.forEach((p, i) => { if (i) lines.push('', ''); wrap(p, 34).forEach(l => lines.push(l)); });
    this.lines = lines; this.scrollY = H + 8; this.stars = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * H, p: Math.random() * 60 | 0 }));
  },
  exit() { this.hideMeme(); },
  go(stage) { this.stage = stage; this.t = 0; Parts.clear(); },
  update() {
    this.f++; this.t++;
    const A = Input.pressed('A') || Input.pressed('START');
    if (this.stage === 'title') {
      if (this.t === 18) { sfx('pop'); Parts.confetti(120, 60, 90, 4); Shake.start(10, 2); }
      if (this.t > 18 && this.t % 14 === 0) Parts.confetti(Math.random() * W, -4, 14, 1.5);
      if (this.t % 70 === 0 && this.t > 30) { sfx('pop'); Parts.confetti(30 + Math.random() * 180, 40 + Math.random() * 40, 30, 3); }
      if ((this.t > 150 && A) || this.t > 460) { Input.consume(); Trans.go('fade', () => { this.go('meme'); this.showMeme(); }, { dur: 18, color: '#fff' }); this.t = -9999; }
    } else if (this.stage === 'meme') {
      if (this.t === 4) { sfx('boing'); if (!Audio.playFileOnce('memeSound')) { /* synth fallback */ } }
      if (this.t % 16 === 0) this.spawnHeart();
      if (this.t % 22 === 0) Parts.hearts(Math.random() * W, H + 4, 1);
      if (this.t === 160) sfx('boing');
      if ((this.t > 140 && A) || this.t > 560) { Input.consume(); Trans.go('fade', () => { this.hideMeme(); this.go('credits'); Audio.playMusic('credits', .8); }, { dur: 30 }); this.t = -9999; }
    } else if (this.stage === 'credits') {
      const sp = Input.isHeld('A') ? 1.2 : .32; this.scrollY -= sp;
      if (this.f % 40 === 0) Parts.hearts(Math.random() * W, H + 4, 1);
      if (this.scrollY + this.lines.length * 12 < -6) this.go('final');
    } else if (this.stage === 'final') {
      if ((this.t > 120 && A) || this.t > 300) { Input.consume(); this.go('from'); sfx('confirm'); }
    } else if (this.stage === 'from') {
      if (this.t % 30 === 0) Parts.hearts(60 + Math.random() * 120, 120, 1);
      if (this.t > 70 && A) { Input.consume(); sfx('confirm'); setFlag('gameDone'); S.map = 'home'; S.x = 20; S.y = 6; S.dir = 3; Save.write(); Audio.stopMusic(.6);
        Trans.go('fade', () => setScene(OW, { map: 'home', x: 20, y: 6, dir: 3 }), { dur: 40 }); this.t = -9999; }
    }
  },
  showMeme() {
    memeEl.innerHTML = ''; memeEl.classList.add('show');
    const ham = () => { const d = document.createElement('div'); d.className = 'ham'; d.innerHTML = '🐹<span class="h">❤️</span>'; memeEl.appendChild(d); };
    if (CONFIG.MEME_IMAGE_URL) { const img = new Image(); img.alt = ''; img.onerror = () => { img.remove(); ham(); }; img.src = CONFIG.MEME_IMAGE_URL; memeEl.appendChild(img); }
    else ham();
  },
  spawnHeart() {
    if (!memeEl.classList.contains('show')) return;
    const h = document.createElement('span'); h.className = 'fh'; h.textContent = pick(['❤️', '💖', '💕', '❤️']);
    h.style.left = (5 + Math.random() * 88) + '%'; h.style.setProperty('--dx', ((Math.random() - .5) * 60) + 'px'); h.style.animationDuration = (3 + Math.random() * 2.5) + 's';
    h.addEventListener('animationend', () => h.remove()); memeEl.appendChild(h);
  },
  hideMeme() { memeEl.classList.remove('show'); memeEl.innerHTML = ''; },
  render(g) {
    const f = this.f;
    if (this.stage === 'title') {
      g.fillStyle = '#2a1050'; g.fillRect(0, 0, W, H);
      const cols = ['#3d1a6e', '#5a237e']; g.save(); g.translate(120, 74);
      for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8 + f / 120; g.fillStyle = cols[i % 2]; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * 260, Math.sin(a) * 260); g.lineTo(Math.cos(a + Math.PI / 8) * 260, Math.sin(a + Math.PI / 8) * 260); g.closePath(); g.fill(); }
      g.restore();
      const T = CONFIG.ENDING_TITLE; const sc = 4; const tw = textW(T) * sc; let x = Math.round(120 - tw / 2);
      const k = clamp(this.t / 30, 0, 1); const by = Math.round(lerp(-50, 46, easeOutBounce(k)));
      const pal = ['#ffd34a', '#ff9d2e', '#ff5d7a', '#5dff9a', '#5dc8ff', '#c38bff'];
      for (let i = 0; i < T.length; i++) { const y = by + Math.round(Math.sin(f / 10 + i * .7) * 3);
        text(g, T[i], x + 3, y + 4, '#14062a', { scale: sc }); text(g, T[i], x, y, pal[(i + (f >> 3)) % pal.length], { scale: sc, outline: '#14062a', od: 2 }); x += glyphAdv(T[i]) * sc; }
      if (this.t > 40) text(g, 'HAPPY BIRTHDAY, SARTHAK!', 120, 104, '#fff', { align: 'center', outline: '#14062a' });
      if (this.t > 150 && (f >> 4) % 2 === 0) text(g, '▼', 226, 146, '#fff');
    } else if (this.stage === 'meme') {
      g.fillStyle = '#ffd6e6'; g.fillRect(0, 0, W, H);
      for (let y = -16; y < H + 16; y += 16) for (let x = -16; x < W + 16; x += 16) { const ox = (f * .3) % 16; if (((x + y) / 16) % 2 === 0) text(g, '♥', x + ox, y + ox * .5, '#ffb8d2'); }
      g.fillStyle = '#ff9ec4'; g.fillRect(0, 128, W, 32);
      text(g, CONFIG.MEME_CAPTION + ' ♥', 120, 138, '#fff', { align: 'center', scale: 2, outline: '#c0306a' });
    } else if (this.stage === 'credits' || this.stage === 'final' || this.stage === 'from') {
      g.fillStyle = '#0b0a1f'; g.fillRect(0, 0, W, H);
      for (const s of this.stars) { if ((f + s.p) % 60 < 44) { g.fillStyle = (f + s.p) % 60 < 6 ? '#fff' : '#8a84d8'; g.fillRect(s.x | 0, s.y | 0, 1, 1); } }
      g.fillStyle = '#16133a'; g.fillRect(0, 140, W, 20); g.fillStyle = '#1e1a4a'; g.fillRect(0, 140, W, 1);
      if (this.stage === 'credits') {
        g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip();
        this.lines.forEach((l, i) => { const y = Math.round(this.scrollY + i * 12); if (y < -12 || y > H) return;
          text(g, l, 120, y, '#fff7e6', { align: 'center', shadow: '#3a2a6a' }); });
        g.restore();
        g.fillStyle = '#0b0a1f'; g.fillRect(0, 0, W, 6); g.fillRect(0, H - 6, W, 6);
      } else if (this.stage === 'final') {
        const a = clamp(this.t / 50, 0, 1); g.save(); g.globalAlpha = Math.round(a * 6) / 6;
        text(g, CONFIG.ENDING_LINE, 120, 74, '#fff', { align: 'center', shadow: '#3a2a6a' }); g.restore();
      } else {
        const a = clamp(this.t / 40, 0, 1); g.save(); g.globalAlpha = Math.round(a * 6) / 6;
        text(g, CONFIG.FROM_LINE, 120, 54, '#ffd34a', { align: 'center', scale: 2, outline: '#14062a' });
        text(g, '♥', 120, 80, '#ff5d7a', { align: 'center', scale: 2 }); g.restore();
        if (this.t > 70 && (f >> 4) % 2 === 0) text(g, '▶ BACK TO TOWN', 120, 118, '#fff', { align: 'center' });
      }
    }
  }
};

/* ==========================================================================
   SCENE MANAGER + FIXED-TIMESTEP LOOP
   ========================================================================== */
let scene = null;
function setScene(s, arg) { if (scene && scene.exit) scene.exit(); Parts.clear(); Dialog.active = false; Dialog.done = null; scene = s; if (s.enter) s.enter(arg); }
function update() {
  Trans.update();
  if (Dialog.active) Dialog.update();
  if (scene) scene.update();
  Parts.update(); Shake.update();
  if (toast && --toast.t <= 0) toast = null;
}
function render() {
  ctx.save(); ctx.translate(Shake.ox(), Shake.oy());
  if (scene) scene.render(ctx);
  Parts.render(ctx);
  ctx.restore();
  Dialog.render(ctx);
  Trans.render(ctx);
  if (toast) { const w = textW(toast.text) + 14; box(ctx, W - w - 4, 4, w, 17, 'dark'); text(ctx, toast.text, W - w + 3, 8, Audio.muted ? '#ff8f8f' : '#5dff9a'); }
}
const STEP = 1000 / 60; let lastT = performance.now(), accT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = now - lastT; lastT = now; if (dt > 250 || dt < 0) dt = STEP;
  accT += dt; let n = 0;
  while (accT >= STEP) { update(); Input.endFrame(); accT -= STEP; if (++n >= 4) { accT = 0; break; } }
  if (n) render();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Audio.suspend(); Input.clearAll(); pointers.clear(); }
  else { Audio.resume(); lastT = performance.now(); accT = 0; }
});

/* ==========================================================================
   BOOT
   ========================================================================== */
Audio.init(); syncMuteBtn(); buildSprites();
// Pre-render every map's tiles (all variants and animation frames) and every duel backdrop once at boot.
for (const k in MAPS) { const m = MAPS[k]; const w = Math.max(...m.rows.map(r => r.length)); m._cells = buildMapCells(m.rows.map(r => (r + 'v'.repeat(w)).slice(0, w))); }
['home', 'street', 'forest', 'fortress'].forEach(duelBG);
const tapEl = document.getElementById('tap');
if (IS_MOBILE) {
  setScene(Idle); tapEl.classList.add('show');
  tapEl.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); Audio.unlock(); tapEl.classList.remove('show'); vib(15); setScene(Boot); }, { once: true });
} else setScene(Controls);
render();
requestAnimationFrame(frame);
// Small hook for debugging / testing in the console
window.__HQ = { S, OW, Duel, Dialog, Input, Trans, MAPS, Save, Audio, startDuel, setScene, Title, Ending, get scene() { return scene; } };
